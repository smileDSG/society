# ============================================================
# 象罔官网 · 对外服务的容器内 Nginx 配置
# 挂载到：/etc/nginx/conf.d/default.conf
#
# 站点根 /usr/share/nginx/html 由 deploy/publish.sh 组装出来：
#     /                伪装站（仓库 mask/）  ← 陌生人看到的
#     /<密钥>/         真实站（仓库 v3/）    ← 密钥只存在服务器上
#
# 本文件不含密钥，放公开仓库是安全的。
#
# ⚠️ 改完这个文件必须重启容器才生效：
#     docker restart xiangwang-site
#   （它是「单文件 bind mount」，git 更新文件会换 inode，
#     容器仍绑在旧 inode 上 —— 只 reload nginx 也读不到新内容。）
# ============================================================

# 单 IP 限速，压掉扫描器和批量爬取。
#   ⚠️ 按「客户端 IP」计数，所以同一个出口 IP 的人共用这一份额度
#      （校园网 NAT、宿舍路由器、机房都是共用一个 IP）。
#      额度必须按"人最多的那个场景"给，不能按单个人给。
#   想关掉：把下面这行和 server 段里的 limit_req / limit_req_status 一起注释掉。
#   想调松/调紧：改 rate 与 burst 即可，改完记得 docker restart。
limit_req_zone $binary_remote_addr zone=xwlimit:10m rate=60r/s;

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------- 抹掉服务器指纹 ----------
    server_tokens off;      # 不回显 nginx 版本号（原来会明晃晃写着 nginx/1.31.5）
    autoindex   off;        # 关目录列表：就算目录名被猜中，也看不到里面有什么

    # 猜错的路径一律给伪装首页，且状态码是 200 —— 扫描器分不清哪个路径真的存在
    error_page 404 = /index.html;
    error_page 403 = /index.html;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;

    limit_req        zone=xwlimit burst=120 nodelay;
    limit_req_status 429;

    # ---------- 静态资源长缓存 ----------
    # ⚠️ nginx 的坑：location 里只要有 add_header，server 段的 add_header 就**全部失效**。
    #    所以这里必须把安全响应头再写一遍，否则 css/js/图片的响应会缺头。
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

        access_log off;
    }

    # ---------- 拦探测 ----------
    # 点文件：.git / .env / .htaccess …
    location ~ /\. { return 404; }

    # 常见备份与配置后缀（.txt 不拦，robots.txt 要能正常返回）
    location ~* \.(bak|old|orig|save|swp|swo|sql|db|ini|conf|cfg|log|yml|yaml|env)$ {
        return 404;
    }

    # ---------- 主路由 ----------
    location / {
        # 纯静态站只需要读，其它动词一律拒绝
        limit_except GET HEAD { deny all; }

        try_files $uri $uri/ $uri.html =404;
    }

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
}
