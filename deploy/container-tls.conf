# ============================================================
# 象罔官网 · 直连模式（方案 A）的容器内 Nginx 配置
# 挂载到：/etc/nginx/conf.d/default.conf
#
# 与 container.conf 的关系：
#   container.conf  → 隧道模式（只听 127.0.0.1:8085，靠 Cloudflare 出公网）
#   container-tls.conf → 直连模式（直接对外 80/443，自签或 Let's Encrypt 证书）
#
# 两者都只管「root + 安全头 + 限速」；伪装层（根=假站 / <密钥>/=真站）
# 是 publish.sh 在文件系统层面铺好的，与这份配置无关 —— 所以直连后
# 掩盖层、密钥路径、安全边界全部原样保留。
#
# 证书路径（由 setup-direct.sh 准备，挂在 /etc/nginx/tls 下）：
#   /etc/nginx/tls/fullchain.pem
#   /etc/nginx/tls/privkey.pem
#
# ⚠️ 改完必须 docker restart xiangwang-site（单文件 bind mount 换 inode，
#    只 reload 读不到新内容）。
# ============================================================

# 单 IP 限速：压掉扫描器和批量爬取。和 container.conf 同参数。
limit_req_zone $binary_remote_addr zone=xwlimit:10m rate=60r/s;

# ---------- 80 端口：只做两件事 ----------
#   1) Let's Encrypt 的 HTTP-01 校验目录（certbot 写文件到这里）
#   2) 其它一切 80 请求 301 跳转到 HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # ACME 校验：certbot 用 webroot 模式时，会把挑战文件放到这里
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 端口：真正对外服务 ----------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    # 现代 TLS 默认值：协议与套件交给 nginx:alpine 的内置安全默认值
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------- 抹掉服务器指纹 ----------
    server_tokens off;
    autoindex   off;

    # 猜错的路径一律给伪装首页（200），扫描器分不清哪个路径真的存在
    error_page 404 = /index.html;
    error_page 403 = /index.html;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;

    limit_req        zone=xwlimit burst=120 nodelay;
    limit_req_status 429;

    # ---------- 静态资源长缓存 ----------
    # ⚠️ nginx 坑：location 里有 add_header，server 段的 add_header 就全部失效，
    #    所以这里必须把安全响应头（含 HSTS）再写一遍。
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000"             always;

        access_log off;
    }

    # ---------- 拦探测 ----------
    location ~ /\. { return 404; }

    location ~* \.(bak|old|orig|save|swp|swo|sql|db|ini|conf|cfg|log|yml|yaml|env)$ {
        return 404;
    }

    # ---------- 主路由 ----------
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ $uri.html =404;
    }

    # ---------- 安全响应头（含 HSTS）----------
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000"             always;
}

# ---------- 8085 端口：给 Cloudflare 隧道做 HTTP 回源 ----------
# 隧道用 --network host 连本机 127.0.0.1:8085（明文 HTTP，无需证书校验，也不会被 80 的跳转坑死）。
# 只有 127.0.0.1 能访问，公网摸不到；对外用户仍走 80/443。
server {
    listen      8085;
    listen      [::]:8085;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    autoindex   off;
    error_page 404 = /index.html;
    error_page 403 = /index.html;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;

    limit_req        zone=xwlimit burst=120 nodelay;
    limit_req_status 429;

    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    location ~ /\. { return 404; }
    location ~* \.(bak|old|orig|save|swp|swo|sql|db|ini|conf|cfg|log|yml|yaml|env)$ { return 404; }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ $uri.html =404;
    }

    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
}
